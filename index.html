---
layout: null
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lu 的科研个人主页，关注人工智能、大语言模型与机器学习。">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/img/favicon.ico">
  <title>Lu · Research</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f8fb;
      --surface: #ffffff;
      --text: #202733;
      --muted: #687386;
      --line: #e5e9ef;
      --accent: #2367aa;
      --accent-soft: #edf5fc;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font: 16px/1.75 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell {
      width: min(960px, calc(100% - 32px));
      margin: 42px auto;
      background: var(--surface);
      box-shadow: 0 18px 60px rgba(24, 39, 58, .08);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 23px 44px;
      border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 650; letter-spacing: .02em; }
    nav { display: flex; gap: 24px; }
    nav a { color: var(--muted); }
    main {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 60px;
      padding: 58px 44px 72px;
    }
    .portrait {
      width: 210px;
      height: 210px;
      display: block;
      object-fit: contain;
      background: #fff;
      border-radius: 14px;
    }
    h1 { margin: 22px 0 2px; font-size: 32px; line-height: 1.2; }
    h2 { margin: 42px 0 14px; font-size: 21px; }
    p { margin: 0 0 14px; }
    .muted { color: var(--muted); }
    .profile-links { display: grid; gap: 8px; margin-top: 22px; }
    .intro { font-size: 18px; color: var(--text); }
    .topics { display: flex; flex-wrap: wrap; gap: 9px; }
    .topic {
      padding: 5px 11px;
      border-radius: 5px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .note {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
    }
    footer {
      padding: 20px 44px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --page:#101315; --surface:#191d20; --text:#edf1f4; --muted:#a8b2bd; --line:#30363d; --accent:#7cb5ef; --accent-soft:#192d42; }
      .portrait { background: #fff; }
      .shell { box-shadow: none; }
    }
    @media (max-width: 700px) {
      .shell { width: 100%; margin: 0; box-shadow: none; }
      header { padding: 19px 20px; }
      nav { gap: 14px; }
      main { grid-template-columns: 1fr; gap: 38px; padding: 36px 20px 52px; }
      aside { display: grid; grid-template-columns: 120px 1fr; gap: 0 20px; align-items: start; }
      .portrait { width: 120px; height: 120px; grid-row: 1 / 4; }
      h1 { margin-top: 0; }
      .profile-links { grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      footer { padding: 18px 20px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">Lu · Research</div>
      <nav aria-label="页面导航"><a href="#about">简介</a><a href="#research">研究</a><a href="#contact">联系</a></nav>
    </header>

    <main>
      <aside>
        <img class="portrait" src="/img/conan-profile.webp" alt="名侦探柯南">
        <div>
          <h1>Lu</h1>
          <p class="muted">AI Researcher</p>
        </div>
        <div class="profile-links" id="contact">
          <a href="mailto:luli662413@gmail.com">Email</a>
          <a href="https://github.com/Lulili520">GitHub</a>
        </div>
      </aside>

      <article>
        <section id="about">
          <p class="intro">你好，我是 Lu。我关注人工智能与大语言模型，并在这里记录自己的研究方向与科研工作。</p>
        </section>

        <section id="research">
          <h2>Research Interests</h2>
          <div class="topics">
            <span class="topic">Large Language Models</span>
            <span class="topic">Machine Learning</span>
            <span class="topic">AI for Science</span>
          </div>
          <p class="note">研究成果与论文将在准备完成后更新。</p>
        </section>
      </article>
    </main>

    <footer>© 2026 Lu · Image © Gosho Aoyama / Shogakukan, YTV, TMS</footer>
  </div>
</body>
</html>
